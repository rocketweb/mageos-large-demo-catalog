name: wands-lab35-enriched
services:
  php:
    image: sha256:65c34b4f6c2512cc7ea82db58381febf55e849a53c0fa9c12431d938269213ce
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./packages:/packages:ro
    environment:
      PHP_MEMORY_LIMIT: 3G
    mem_limit: 4g
    cpus: 4
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${LAB_DB_ROOT_PASSWORD:?required}
      MARIADB_DATABASE: lab_empty
      MARIADB_USER: lab_catalog
      MARIADB_PASSWORD: ${LAB_DB_PASSWORD:?required}
    volumes:
      - ./db:/var/lib/mysql
    mem_limit: 3g
    cpus: 2
  search:
    image: opensearchproject/opensearch:3.1.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms2g -Xmx2g
    volumes:
      - ./search:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 4g
    cpus: 2
  web:
    image: nginx:1.28-alpine
    depends_on:
      - php
    ports:
      - 127.0.0.1:18036:80
    volumes:
      - ./src:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fastcgi_params:/etc/nginx/fastcgi_params:ro
    mem_limit: 128m
    cpus: 0.5
