name: osrw-security-integration

services:
  opensearch:
    image: opensearchproject/opensearch:3.8.0@sha256:bcc1797519726ceb6d651d4a3e60b7c30da91793914a8dfe75fd441d4f641509
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OSRW_SECURITY_ADMIN_PASSWORD:-Kite7!River9@Quartz3#Plum}"
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
    ports:
      - "127.0.0.1:${OSRW_SECURITY_PORT:-9228}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --insecure --user "admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}" 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null
      interval: 5s
      timeout: 6s
      retries: 60
      start_period: 30s
    restart: "no"

volumes:
  opensearch-data:
